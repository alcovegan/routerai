[project]
name = "routerai"
version = "0.1.1"
description = "Python wrapper for the RouterAI API — unified access to 400+ AI models with ruble pricing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexander Sharabarov" }]
keywords = ["routerai", "llm", "ai", "openai-compatible", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
# Lower bounds are exercised by the "minimums" CI job, so they must be real:
# pytest-asyncio < 0.23.8 crashes on pytest 8, ruff < 0.16 flags code this repo
# ships, and pip/pytest below these versions carry known advisories.
dev = [
    "pip>=25.2",
    "pip-audit>=2.7",
    "pytest>=8.4",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0",
    "pytest-socket>=0.6",
    "respx>=0.21",
    "ruff>=0.16",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/alcovegan/routerai"
Documentation = "https://github.com/alcovegan/routerai#readme"
Issues = "https://github.com/alcovegan/routerai/issues"
Changelog = "https://github.com/alcovegan/routerai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routerai"]

[tool.hatch.build.targets.sdist]
# Allowlist, not denylist: a denylist ships whatever happens to sit in the
# working tree at build time.
include = [
    "src",
    "tests",
    "README.md",
    "README.ru.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Кассеты и тесты вокруг них описаны по-русски: RUF001/RUF002 принимают
# кириллицу рядом с латинскими идентификаторами за опечатку.
"tests/test_cassettes.py" = ["RUF001", "RUF002"]
"tests/cassettes/__init__.py" = ["RUF002"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# xfail_strict turns the xfail markers in test_cassettes.py into a to-do list:
# fixing a defect makes its test XPASS, which fails the run until the marker goes.
xfail_strict = true
filterwarnings = [
    "error",
    # pytest-socket raises SocketBlockedError through a UserWarning
    "ignore::UserWarning",
]
markers = [
    "live: run against the real RouterAI API (requires ROUTERAI_API_KEY env var)",
]
