name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: build and smoke-install only read the repository; the
# publishing jobs get their extra rights individually.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: Verify tag matches package version
        run: |
          package_version=$(uv version --short)
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q -m "not live"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: [build, smoke-install]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  smoke-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          uv venv --python ${{ matrix.python-version }} /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/python -c "import routerai; print(routerai.__version__)"
          /tmp/smoke-venv/bin/python -c "from routerai import RouterAI, Registry, StreamAccumulator; from routerai.webhooks import verify_video"
          uv venv --python ${{ matrix.python-version }} /tmp/sdist-venv
          uv pip install --python /tmp/sdist-venv/bin/python --no-binary routerai dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import routerai; print('sdist', routerai.__version__)"

  github-release:
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write          # creates the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
